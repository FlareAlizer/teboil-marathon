# Развёртывание на Render одним нажатием — запасной вариант к основному
# серверу (teboil.space на своём VPS, см. scripts/ и /opt/teboil).
#
# Открыть: https://render.com/deploy?repo=https://github.com/FlareAlizer/teboil-marathon
# Render прочитает этот файл, создаст базу PostgreSQL, соберёт проект и
# выдаст постоянный адрес. Схема базы создаётся сама при первом запросе.
#
# Бесплатная база Render живёт ограниченное время — для показа заказчику
# этого хватает, для мероприятия — нет: там работает основной сервер.

services:
  - type: web
    name: teboil-marathon
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Подключение к базе ниже — Render подставит адрес сам.
      - key: DATABASE_URL
        fromDatabase:
          name: teboil-db
          property: connectionString
      # Пароль оператора для входа в /admin.
      # Render сгенерирует случайный — посмотреть можно в панели,
      # вкладка Environment. Замените на свой, если нужен читаемый.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22.11.0

databases:
  - name: teboil-db
    plan: free
    region: frankfurt
